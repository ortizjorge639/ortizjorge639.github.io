name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:guide
      - run: npm run test:stories
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test -- --grep-invert "touch drag paints"
      - run: npm run test:responsive
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  native-touch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test -- --project=mobile --grep "touch drag paints"
      - name: Preserve native touch failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-touch-failures
          path: test-results/
          retention-days: 7
  hosted-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.hosted.config.ts
      - name: Preserve hosted fixture failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-ui-failures
          path: test-results/
          retention-days: 7
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, native-touch, hosted-ui]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
